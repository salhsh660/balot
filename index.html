<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>حاسبة بلوت 152</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#111a2e;
      --text:#eef2ff;
      --muted:#a8b3cf;
      --border:rgba(255,255,255,.10);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --primary:#5b8cff;
      --primary2:#7c5cff;
      --chip:rgba(255,255,255,.08);
      --ok:#22c55e;
      --bad:#ef4444;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb;
        --card:#ffffff;
        --text:#111827;
        --muted:#6b7280;
        --border:rgba(17,24,39,.10);
        --shadow:0 10px 30px rgba(17,24,39,.08);
        --chip:rgba(17,24,39,.06);
      }
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 20% -10%, rgba(91,140,255,.25), transparent 60%),
                  radial-gradient(900px 600px at 90% 10%, rgba(124,92,255,.22), transparent 55%),
                  var(--bg);
      color:var(--text);
      padding: 14px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      min-height:100dvh;
    }

    .wrap{max-width:900px; margin:0 auto}

    header{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin:6px 0 10px;
    }
    .title{display:flex; flex-direction:column; gap:6px}
    h1{font-size:20px; margin:0}
    .sub{font-size:13px; color:var(--muted)}
    .target{
      font-weight:700;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color:white;
      padding:10px 12px;
      border-radius:14px;
      box-shadow: var(--shadow);
      white-space:nowrap;
      font-size:13px;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin: 10px 0;
    }

    /* المربع الأول ياخذ الشاشة تقريباً */
    .hero{
      min-height: calc(100dvh - 28px);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* الإدخالات جنب بعض */
    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    /* نخليها جنب بعض حتى على الجوال، إلا إذا الشاشة ضيقة جداً */
    @media (max-width:360px){
      .grid2{grid-template-columns:1fr}
    }

    label{
      display:flex; justify-content:space-between; align-items:center;
      font-size:13px; color:var(--muted); margin:0 0 8px;
    }
    .field{
      background: var(--chip);
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    input{
      width:100%;
      font-size:18px;
      padding:0;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
    }
    input::placeholder{color:rgba(168,179,207,.75)}
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      flex:0 0 auto;
      opacity:.95;
    }

    .actions{
      display:grid;
      grid-template-columns: 1.2fr .9fr .9fr;
      gap:10px;
      margin-top:4px;
    }
    button{
      width:100%;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 12px;
      font-size:15px;
      cursor:pointer;
      background: var(--chip);
      color:var(--text);
      transition: transform .05s ease;
      touch-action: manipulation;
    }
    button:active{transform: scale(.99)}
    .primary{
      border:0;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color:white;
      font-weight:700;
    }
    .danger{
      background: rgba(239,68,68,.12);
      border-color: rgba(239,68,68,.22);
    }

    .msg{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(239,68,68,.12);
      display:none;
      font-size:13px;
    }

    /* مجموع لنا/لهم داخل نفس المربع */
    .totals{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .pill{
      padding:12px 12px;
      border-radius:16px;
      border:1px solid var(--border);
      background: var(--chip);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:14px;
    }
    .pill b{font-size:18px}
    .badge{
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      white-space:nowrap;
    }
    .win{
      border-color: rgba(34,197,94,.30);
      background: rgba(34,197,94,.12);
    }

    .hintRow{
      display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
      color:var(--muted); font-size:12px;
      margin-top:auto;
      padding-top:6px;
    }

    /* السجل تحت */
    .tableWrap{
      overflow:auto;
      border-radius:16px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.06);
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width: 520px;
    }
    th, td{
      padding:12px 12px;
      border-bottom:1px solid var(--border);
      text-align:right;
      font-size:14px;
    }
    th{
      position: sticky;
      top:0;
      background: rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index:1;
      color: var(--muted);
      font-weight:600;
    }
    tr:last-child td{border-bottom:0}
    .rowTotal{color:var(--muted); font-size:13px}
    .sectionTitle{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin:0 0 10px;
    }
    .sectionTitle h2{margin:0; font-size:16px}
    .mini{font-size:12px; color:var(--muted)}
  </style>
</head>

<body>
<div class="wrap">
  <section class="card hero" aria-label="الإدخال والمجموع">
    <header>
      <div class="title">
        <h1>حاسبة بلوت</h1>
        <div class="sub">سجل نقاط (لنا / لهم) — وتحفظ تلقائياً على الجهاز</div>
      </div>
      <div class="target">الهدف: 152</div>
    </header>

    <div class="totals">
      <div id="tUs" class="pill">
        <span>لنا</span>
        <b id="vUs">0</b>
        <span class="badge" id="bUs">جاري</span>
      </div>

      <div id="tThem" class="pill">
        <span>لهم</span>
        <b id="vThem">0</b>
        <span class="badge" id="bThem">جاري</span>
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>نقاط لنا <span class="badge">الجولة</span></label>
        <div class="field">
          <span class="dot"></span>
          <input id="us" inputmode="numeric" autocomplete="off" placeholder="0" />
        </div>
      </div>

      <div>
        <label>نقاط لهم <span class="badge">الجولة</span></label>
        <div class="field">
          <span class="dot"></span>
          <input id="them" inputmode="numeric" autocomplete="off" placeholder="0" />
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="add" class="primary">إضافة الجولة</button>
      <button id="undo">تراجع</button>
      <button id="reset" class="danger">تصفير</button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="hintRow">
      <span>Enter للإضافة</span>
      <span>سجل الجولات تحت ↓</span>
    </div>
  </section>

  <section class="card" aria-label="سجل الجولات">
    <div class="sectionTitle">
      <h2>سجل الجولات</h2>
      <div class="mini">عدد الجولات: <span id="roundCount">0</span></div>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th style="width:70px">#</th>
            <th>لنا</th>
            <th>لهم</th>
            <th>بعد الإضافة</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  const TARGET = 152;

  const elUs = document.getElementById('us');
  const elThem = document.getElementById('them');
  const elAdd = document.getElementById('add');
  const elUndo = document.getElementById('undo');
  const elReset = document.getElementById('reset');
  const elRows = document.getElementById('rows');
  const elMsg = document.getElementById('msg');

  const vUs = document.getElementById('vUs');
  const vThem = document.getElementById('vThem');
  const tUs = document.getElementById('tUs');
  const tThem = document.getElementById('tThem');
  const bUs = document.getElementById('bUs');
  const bThem = document.getElementById('bThem');
  const roundCount = document.getElementById('roundCount');

  let rounds = []; // {us, them, totalUs, totalThem}

  function showError(text){
    elMsg.textContent = text;
    elMsg.style.display = 'block';
  }
  function clearError(){
    elMsg.textContent = '';
    elMsg.style.display = 'none';
  }

  // طلبك: إذا الخانة فاضية = 0
  function parsePointsAllowEmpty(v){
    const s = (v ?? '').trim();
    if (s === '') return 0;
    if (!/^\d+$/.test(s)) return NaN;
    return Number(s);
  }

  function totals(){
    if (!rounds.length) return {us:0, them:0};
    const last = rounds[rounds.length - 1];
    return {us:last.totalUs, them:last.totalThem};
  }

  function render(){
    elRows.innerHTML = '';
    for (let i = 0; i < rounds.length; i++){
      const r = rounds[i];
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i+1}</td>
        <td>${r.us}</td>
        <td>${r.them}</td>
        <td class="rowTotal">لنا ${r.totalUs} — لهم ${r.totalThem}</td>
      `;
      elRows.appendChild(tr);
    }

    const t = totals();
    vUs.textContent = t.us;
    vThem.textContent = t.them;
    roundCount.textContent = rounds.length;

    const usReached = t.us >= TARGET;
    const themReached = t.them >= TARGET;

    tUs.classList.toggle('win', usReached);
    tThem.classList.toggle('win', themReached);

    bUs.textContent = usReached ? 'وصل ✅' : 'جاري';
    bThem.textContent = themReached ? 'وصل ✅' : 'جاري';

    save();
  }

  function addRound(){
    clearError();

    const us = parsePointsAllowEmpty(elUs.value);
    const them = parsePointsAllowEmpty(elThem.value);

    if (!Number.isFinite(us) || !Number.isFinite(them)) return showError('اكتب أرقام فقط.');
    if (us < 0 || them < 0) return showError('النقاط ما تكون سالبة.');

    const prev = totals();
    rounds.push({
      us, them,
      totalUs: prev.us + us,
      totalThem: prev.them + them
    });

    elUs.value = '';
    elThem.value = '';
    elUs.focus();
    render();
  }

  function undo(){
    clearError();
    if (!rounds.length) return;
    rounds.pop();
    render();
  }

  function resetAll(){
    clearError();
    rounds = [];
    localStorage.removeItem('baloot_rounds_v3');
    render();
  }

  function save(){
    localStorage.setItem('baloot_rounds_v3', JSON.stringify(rounds));
  }

  function load(){
    try{
      const raw = localStorage.getItem('baloot_rounds_v3');
      if (raw) rounds = JSON.parse(raw) || [];
    } catch(e){
      rounds = [];
    }
    render();
  }

  elAdd.addEventListener('click', addRound);
  elUndo.addEventListener('click', undo);
  elReset.addEventListener('click', resetAll);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addRound();
  });

  load();
</script>
</body>
</html>
